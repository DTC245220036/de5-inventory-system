# ============================================================================
# CẤU HÌNH PROMTAIL - THU THẬP LOG TỪ DOCKER CONTAINERS & NGINX VỀ LOKI
# ============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Tự động phát hiện và thu thập log từ tất cả Docker containers qua Docker Socket
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            event: event
            method: method
            status: status
            sku: sku
      - labels:
          level:
          event:

  # 2. Thu thập trực tiếp Access Log & Error Log của Nginx Reverse Proxy
  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx-proxy
          __path__: /var/log/nginx/*.log

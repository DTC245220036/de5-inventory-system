# ============================================================================
# CẤU HÌNH NGINX REVERSE PROXY + SSL/TLS TỰ KÝ + SECURITY HEADERS (HARDENING)
# Đề tài 5: Hệ thống Quản lý Kho hàng (Inventory Management System)
# ============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HARDENING 1: Ẩn phiên bản Nginx trên header phản hồi và trang lỗi
    server_tokens off;

    # Định dạng JSON Log cho Nginx để Promtail + Loki phân tích dễ dàng bằng LogQL
    log_format json_analytics escape=json
      '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"service":"nginx-proxy"'
      '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 5M;

    # HARDENING 2: Giới hạn tốc độ truy cập (Rate Limiting) chống Brute-force / DoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    # Khai báo Upstream trỏ tới container ứng dụng Web Quản lý Kho hàng
    upstream inventory_backend {
        server inventory-app:3000;
        keepalive 32;
    }

    # ------------------------------------------------------------------------
    # Cổng 80 (HTTP): Phục vụ endpoint /nginx_status nội bộ cho Prometheus
    # và tự động chuyển hướng (Redirect 301) hoặc proxy an toàn
    # ------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost inventory.local;

        # Endpoint nội bộ cung cấp metrics cho nginx-prometheus-exporter
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # Bảo mật: Chặn truy cập các file ẩn (.env, .git, .htaccess)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Security Headers cơ bản ngay cả trên cổng HTTP (phục vụ kiểm thử nhanh)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------------
    # Cổng 443 (HTTPS): Reverse Proxy với Chứng chỉ SSL/TLS tự ký + Hardening
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost inventory.local;

        # Chứng chỉ SSL tự ký (Self-Signed Certificate)
        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        # HARDENING 3: Chỉ cho phép giao thức TLS 1.2 và TLS 1.3 hiện đại
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HARDENING 4: Bộ Security Headers đầy đủ chuẩn OWASP
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

        # Chặn truy cập file ẩn
        location ~ /\. {
            deny all;
        }

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
